; WiFi-CSI Radar
; Targets: M5Stack Cardputer ADV (ESP32-S3) and Freenove FNK0104B (ESP32-S3-WROOM-1)
; WiFi credentials: copy credentials.ini.example to credentials.ini and fill in values.

[platformio]
default_envs = cardputer-radar-csi

[common]
WIFI_SSID=your_home_wifi
WIFI_PASS=your_home_wifi_password

; Cardputer ADV: dual-screen, runtime WiFi picker, on-device CSI capture.
; Flash: pio run -e cardputer-radar-csi -t upload
[env:cardputer-radar-csi]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StampS3
    -Os

; Freenove FNK0104B: single 240x320 display, FT6336U touch
; POC build — uses RADAR_CSI with on-device WiFi + CSI.
; Flash: pio run -e freenove-fnk0104b -t upload
[env:freenove-fnk0104b]
platform                = espressif32@7.0.1
board                   = esp32-s3-devkitc-1
framework               = arduino
board_build.mcu         = esp32s3
board_build.f_cpu       = 240000000L
board_build.flash_mode  = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size  = 16MB
monitor_speed           = 115200
upload_speed            = 460800
lib_deps =                lovyan03/LovyanGFX@^1.1.0
                          https://github.com/aselectroworks/Arduino-FT6336U.git
build_unflags           = -fno-tree-switch-conversion
build_flags             = -Ofast                             ;; -O3 + -ffast-math + aggressive opts
                          -funroll-loops                     ;; more aggressive loop unrolling than -Ofast alone
                          -fno-threadsafe-statics            ;; remove mutex guards on local static init
                          -fstrict-volatile-bitfields        ;; use field width for volatile bitfield access (hardware regs)
                          ; -flto                              ;; must be in build_flags; enable_lto.py runs too late for the compiler
                          -fipa-pta                          ;; interprocedural pointer analysis; requires LTO
                          -ffunction-sections                ;; isolate functions for linker GC
                          -fdata-sections                    ;; isolate data for linker GC
                          -Wl,--gc-sections                  ;; linker dead-code elimination; most effective with LTO
                          -fvisibility=hidden                ;; hidden symbols by default; LTO inlines/eliminates more aggressively
                          -fno-semantic-interposition        ;; no symbol interposition assumed; more cross-TU inlining with LTO
                          -fno-exceptions                    ;; drop C++ exception handling code
                          -fno-rtti                          ;; drop C++ runtime type information
                          -fno-unwind-tables                 ;; no unwind tables; safe since exceptions are disabled
                          -fno-asynchronous-unwind-tables    ;; no async unwind tables; safe since exceptions are disabled
                          -fno-jump-tables                   ;; avoid jump tables in flash (Xtensa i-cache unfriendly)
                          -fmerge-all-constants              ;; deduplicate identical constants across translation units
                          ; -mtext-section-literals          ;; inline literals in text; bloats flash on Xtensa, leave disabled
                          ; -Wl,--defsym=_cleanup_r=0          ;; stub out newlib cleanup (bare-metal, no OS to return to)
                          -D ARDUINO_USB_MODE=1
                          -D ARDUINO_USB_CDC_ON_BOOT=1
                          -D FREENOVE_FNK0104B
                          -D BOARD_HAS_PSRAM
                          -D CONFIG_DSP_OPTIMIZED=1
                          ; -D FFT_DEBUG
; extra_scripts           = enable_lto.py